<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swarnaa Creations</title>
<link rel="icon" type="image/png" href="emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>

/* =========================================================
   ROOT
========================================================= */

:root {
    --lavender: #E9E0F3;
    --magenta: #E20171;
    --dark-magenta: #B8005B;
    --text: #332D35;
    --muted: #6F6872;
}


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}


/* =========================================================
   BODY
========================================================= */

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,0.25),
            transparent 45%
        ),
        var(--lavender);

    color: var(--text);

    font-family: "DM Sans", sans-serif;

    overflow: hidden;
}


/* =========================================================
   WATER
========================================================= */

.water {
    position: fixed;

    left: -10%;
    width: 120%;

    pointer-events: none;

    z-index: 1;
}

.water.top {
    top: 8%;
}

.water.bottom {
    bottom: 4%;
    opacity: .6;
}

.water svg {
    width: 100%;
    height: 170px;

    display: block;
}

.water-path {
    fill: none;

    stroke: rgba(226, 1, 113, .15);

    stroke-linecap: round;

    animation: waterFlow 12s ease-in-out infinite;
}

.water-path:nth-child(2) {
    animation-duration: 16s;
    animation-delay: -4s;
    opacity: .7;
}

.water-path:nth-child(3) {
    animation-duration: 20s;
    animation-delay: -8s;
    opacity: .45;
}

@keyframes waterFlow {

    0% {
        transform: translateX(-2%);
    }

    50% {
        transform: translateX(2%);
    }

    100% {
        transform: translateX(-2%);
    }

}


/* =========================================================
   SPARKLE RAIN
========================================================= */

.sparkles {
    position: fixed;
    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 2;
}

.sparkle {
    position: absolute;

    top: -30px;

    width: 5px;
    height: 5px;

    background: var(--magenta);

    transform: rotate(45deg);

    opacity: 0;

    animation: fall linear infinite;
}

.sparkle::before,
.sparkle::after {
    content: "";

    position: absolute;

    background: inherit;

    border-radius: 50%;
}

.sparkle::before {
    width: 100%;
    height: 240%;

    left: 0;
    top: -70%;
}

.sparkle::after {
    width: 240%;
    height: 100%;

    left: -70%;
    top: 0;
}


.sparkle:nth-child(1) { left: 5%; animation-duration: 9s; animation-delay: -3s; --s: 1.5; }
.sparkle:nth-child(2) { left: 15%; animation-duration: 12s; animation-delay: -8s; --s: 0.8; }
.sparkle:nth-child(3) { left: 27%; animation-duration: 10s; animation-delay: -4s; --s: 1.2; }
.sparkle:nth-child(4) { left: 40%; animation-duration: 14s; animation-delay: -11s; --s: 0.6; }
.sparkle:nth-child(5) { left: 53%; animation-duration: 9s; animation-delay: -6s; --s: 1.8; }
.sparkle:nth-child(6) { left: 65%; animation-duration: 13s; animation-delay: -9s; --s: 0.9; }
.sparkle:nth-child(7) { left: 77%; animation-duration: 10s; animation-delay: -2s; --s: 1.4; }
.sparkle:nth-child(8) { left: 89%; animation-duration: 12s; animation-delay: -7s; --s: 0.7; }
.sparkle:nth-child(9) { left: 96%; animation-duration: 9s; animation-delay: -5s; --s: 1.1; }
.sparkle:nth-child(10) { left: 20%; animation-duration: 11s; animation-delay: -1s; --s: 2.0; }
.sparkle:nth-child(11) { left: 35%; animation-duration: 15s; animation-delay: -10s; --s: 0.5; }
.sparkle:nth-child(12) { left: 50%; animation-duration: 10s; animation-delay: -7s; --s: 1.3; }
.sparkle:nth-child(13) { left: 70%; animation-duration: 13s; animation-delay: -14s; --s: 1.6; }
.sparkle:nth-child(14) { left: 85%; animation-duration: 8s; animation-delay: -2s; --s: 0.8; }
.sparkle:nth-child(15) { left: 10%; animation-duration: 14s; animation-delay: -12s; --s: 1.0; }


@keyframes fall {

    0% {
        top: -30px;
        opacity: 0;

        transform:
            translateX(0)
            rotate(45deg)
            scale(calc(var(--s, 1) * 0.6));
    }

    10% {
        opacity: .6;
    }

    50% {
        opacity: .4;
    }

    85% {
        opacity: .2;
    }

    100% {
        top: 110vh;
        opacity: 0;

        transform:
            translateX(30px)
            rotate(225deg)
            scale(var(--s, 1));
    }
}

/* =========================================================
   PAGE CONTENT
========================================================= */

.page {
    position: relative;

    z-index: 5;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;
}


/* =========================================================
   CONTENT
========================================================= */

.content {
    width: min(700px, calc(100% - 40px));
}


/* =========================================================
   MAIN LOGO IMAGE
========================================================= */

.main-logo {
    display: block;
    margin: 0 auto;
    width: 160px; /* Adjusted to emblem size */
    max-width: 100%;
    height: auto;
    animation: swanBob 3.8s ease-in-out infinite;
    position: relative;
    z-index: 4;
}

/* Removed thread CSS */

/* =========================================================
   CUSTOM LOGO CONTAINER
========================================================= */

.logo-area {
    position: relative;
    width: 100%;
    height: auto;
    min-height: 270px;
    margin-bottom: 20px;
    overflow: visible;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* =========================================================
   BRAND NAME
========================================================= */

.brand-name {
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(52px, 8vw, 78px);
    line-height: .9;
    letter-spacing: -.045em;
    color: var(--magenta);
    font-weight: 500;
    position: relative;
    margin-top: 15px;
    z-index: 4;
}

/* =========================================================
   CREATIONS
========================================================= */

.creations {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 4px;
    color: #5E5A60;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: .34em;
    padding-left: .34em;
    position: relative;
    z-index: 4;
}

.creations::before,
.creations::after {
    content: "";
    width: 52px;
    height: 1px;
    background: #77727A;
}


/* =========================================================
   COMING SOON
========================================================= */

.coming-soon {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    color: var(--magenta);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-top: 8px;
    margin-bottom: 24px;
}

.coming-soon::before,
.coming-soon::after {
    content: "";
    width: 45px;
    height: 2px;
    background: var(--magenta);
}


/* =========================================================
   HEADING
========================================================= */

h1 {

    font-family:
        "Playfair Display",
        Georgia,
        serif;

    font-size: clamp(42px, 6vw, 64px);

    line-height: 1.05;

    font-weight: 500;

    letter-spacing: -.03em;

    margin-bottom: 22px;

}


h1 span {
    color: var(--magenta);
}


/* =========================================================
   DESCRIPTION
========================================================= */

.description {

    max-width: 500px;

    margin: auto;

    color: var(--muted);

    font-size: 16px;

    line-height: 1.8;

}


/* =========================================================
   DECORATION
========================================================= */

.decoration {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    margin-top: 30px;

}


.decoration .line {

    width: 38px;

    height: 1px;

    background: rgba(226,1,113,.4);

}


.decoration .dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--magenta);

}


/* =========================================================
   FOOTER
========================================================= */

footer {

    position: fixed;

    bottom: 18px;

    left: 0;
    right: 0;

    text-align: center;

    font-size: 10px;

    letter-spacing: .1em;

    color: rgba(51,45,53,.45);

    z-index: 6;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .content {
        width: calc(100% - 28px);
    }

    .main-logo {
        width: 250px;
    }

    .coming-soon {
        margin-top: 0;
    }

    h1 {
        font-size: 43px;
    }

    .description {
        font-size: 14px;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    .main-logo {
        animation: none;
    }

    .water-path,
    .sparkle {
        animation: none;
    }

}

</style>
</head>


<body>

<script>

/* =========================================================
   SWAN HORIZONTAL MOVEMENT
========================================================= */

const swan = document.getElementById("swan");
const brandName = document.querySelector(".brand-name");

let position = 0;
let direction = 1;
let lastTime = performance.now();
const speed = 0.018;

function moveSwan(time) {
    const delta = time - lastTime;
    lastTime = time;

    // Dynamically calculate travel distance based on the width of "SWARNAA"
    // Keep the flow movement length very small so it just sways gently
    // instead of sweeping across the entire text width.
    const travelDistance = 30;

    position += delta * speed * direction;

    if (position >= travelDistance) {
        position = travelDistance;
        direction = -1;
    }

    if (position <= -travelDistance) {
        position = -travelDistance;
        direction = 1;
    }

    const wave = Math.sin(time * 0.0025) * 5;
    const rotation = direction === 1 ? 1 : -1;

    // Shift the entire center of movement slightly to the right
    // for better visual alignment over the text (towards 'A').
    const rightOffset = 80;

    swan.style.transform = `translateX(calc(-50% + ${rightOffset}px + ${position}px)) translateY(${wave}px) rotate(${rotation}deg)`;
    requestAnimationFrame(moveSwan);
}


requestAnimationFrame(moveSwan);

</script>
